[project]
name = "vinstay-ai-engine"
version = "0.1.0"
description = "VinStay AI Engine: tư vấn thuê căn qua LLM tool-calling (hồ sơ 18, WP5)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
